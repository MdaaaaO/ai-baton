name: main-guard

# CONTRIBUTING.md says every kit change reaches `main` by a squash-merged PR (`hooks/pre-push` says so
# locally). The repo's `main` ruleset requires a PR, but repo admins bypass it, and the local guard is
# bypassed by `KIT_ALLOW_MAIN_PUSH=1`, `--no-verify`, a fresh clone before `setup.sh`/`sync.sh` installed
# `core.hooksPath`, or any other machine. This is the server-side backstop for what gets past both: it
# cannot block the push, but on every push to `main` it checks that
# the pushed commit is the squash of a merged PR and, when it is not, opens (or comments on) a tracking
# issue so the bypass does not go unnoticed.
# Runs on GitHub-hosted runners like every workflow: push-to-main only (docs/contributing.md § Where CI
# runs). It checks out the pushed commit — itself, never a pull request's — so the step below runs that
# commit's own copy of .github/scripts/main-guard.sh, which retries an empty lookup a few times, paced a
# few seconds apart, before flagging a direct push; a forced push is still flagged regardless of the match.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: main-guard
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: The pushed commit must be a squash-merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          FORCED: ${{ github.event.forced }}
        run: ./.github/scripts/main-guard.sh
