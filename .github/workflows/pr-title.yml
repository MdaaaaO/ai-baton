name: pr-title

# Kit PRs are squash-merged, so the PR title becomes the commit subject on main — and that subject becomes
# the CHANGELOG.md line of the next release (docs/contributing.md § Releases). Two checks, one job:
#   conventional-release check-title — the types .conventional-release.toml knows (what the changelog groups by)
#   commit_style.py title            — the kit's own rule on top (≤ 72 chars, no trailing period; docs/commit-style.md)
# Inline rather than conventional-release's reusable pr-title.yml, so the kit's own rule runs in the same job.
# Runs on GitHub-hosted runners like every workflow (docs/contributing.md § Where CI runs).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

# Pushes in quick succession (synchronize on the same PR) queue redundant runs otherwise; keyed on the PR, not the
# ref, so this and pr-issue below cancel independently of what auto-merge.yml later reads.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The checker and the types come from the base commit, so a PR cannot relax the rule that judges
      # its own title (a change to them takes effect for the PRs after it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # An exact version, not a floating range — one pin, .github/versions.env, bumped there via PR. Bootstrap
      # fallback only: a base sha before this file existed (e.g. a PR opened against a main that predates it)
      # has no .github/versions.env to source, so fall back to the same value the file pins — never a second
      # place this drifts from once every base carries the file.
      - name: Load pinned tool versions
        run: |
          [ -f .github/versions.env ] && . .github/versions.env
          : "${CONVENTIONAL_RELEASE_VERSION:=0.3.1}"
          echo "CONVENTIONAL_RELEASE_VERSION=$CONVENTIONAL_RELEASE_VERSION" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          uvx --from "conventional-release==$CONVENTIONAL_RELEASE_VERSION" conventional-release check-title "$TITLE"
          python3 context-db/bin/commit_style.py title --style conventional "$TITLE"

  # Every change comes from an issue (docs/contributing.md, "From issue to merge"). The rule and the
  # parser live in .github/scripts/check-pr-issue.sh — run it locally before `gh pr create`. A change to
  # the script takes effect for the PRs after it (#43).
  pr-issue:
    name: pr-issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read  # the check looks each linked issue up
    steps:
      # The script comes from the base commit, as in pr-title: a PR cannot relax the check that judges it.
      # Title, body and author come from the event payload (env below), not from the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: PR description links the issue it came from
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/check-pr-issue.sh
