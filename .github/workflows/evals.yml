name: evals

# The token-spending half of the eval suite (#54): `claude plugin eval` over evals/, started by hand only. The static
# half (`make -C .claude/context-db eval-check`, no model) runs on every PR in ci.yml; this one scores whether each
# skill still triggers on its positives and stays quiet on its near misses — run it before merging a change to a
# skill's `description:` and cite the result in the PR.
#
# Authenticated like claude-review.yml: the CLAUDE_CODE_OAUTH_TOKEN repository secret (a Claude subscription token from
# `claude setup-token`). Without it the job ends green with a notice. workflow_dispatch only — never on a pull request,
# so no PR's code runs with the token, and nobody spends tokens by pushing. GitHub-hosted runner like every workflow
# (docs/contributing.md § Where CI runs).

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill whose trigger suite to run (evals/<skill>-*); empty = every case (hours, not minutes)"
        required: false
        default: ""
      models:
        description: "Comma-separated model ids to run the suite on, one run per model; empty = the make target's default (sonnet)"
        required: false
        default: ""
      judge_model:
        description: "Model the llm graders vote with; empty = the make target's default"
        required: false
        default: ""
      runs:
        description: "Runs per case (1-9); empty = the CLI's default"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    name: evals
    runs-on: ubuntu-latest
    # One skill's suite fits 30 minutes: every agent run is bounded by its case's `timeout_seconds`, and four run at
    # once (JOBS=4 below) — the 45 runs of one 15-case suite took 738 s. Every case at once is some 940 agent runs,
    # about 4.3 hours at that rate — hence the larger limit for an empty `skill`; that limit is an estimate from the
    # one-suite run, not a measurement. More models or more runs multiply the time: the input check refuses a
    # combination that does not fit the limit chosen here (keep its two numbers equal to these).
    timeout-minutes: ${{ inputs.skill == '' && 300 || 30 }}
    steps:
      - id: token
        name: Is the eval credential configured?
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=evals skipped::CLAUDE_CODE_OAUTH_TOKEN is not set. Run 'claude setup-token' locally and add it with: gh secret set CLAUDE_CODE_OAUTH_TOKEN -R ${{ github.repository }}"
          fi

      - if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .claude

      # Inputs arrive through env, never spliced into the script, and are checked against the shapes they may take.
      - id: inputs
        if: steps.token.outputs.enabled == 'true'
        name: Check the inputs
        working-directory: .claude
        env:
          SKILL: ${{ inputs.skill }}
          MODELS: ${{ inputs.models }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          RUNS: ${{ inputs.runs }}
        run: |
          if [ -n "$SKILL" ]; then
            printf '%s' "$SKILL" | grep -Eq '^[a-z0-9][a-z0-9-]*$' && [ -f "skills/$SKILL/SKILL.md" ] \
              || { echo "::error::skill '$SKILL' is not a skill in this kit"; exit 1; }
          fi
          if [ -n "$JUDGE_MODEL" ]; then
            printf '%s' "$JUDGE_MODEL" | grep -Eq '^[A-Za-z0-9._:@-]+(\[[0-9a-z]+\])?$' || { echo "::error::judge model '$JUDGE_MODEL' is not a model id"; exit 1; }
          fi
          if [ -n "$RUNS" ]; then
            printf '%s' "$RUNS" | grep -Eq '^[1-9]$' || { echo "::error::runs '$RUNS' is not a number from 1 to 9"; exit 1; }
          fi
          models=""
          for m in $(printf '%s' "$MODELS" | tr ',' ' '); do
            printf '%s' "$m" | grep -Eq '^[A-Za-z0-9._:@-]+(\[[0-9a-z]+\])?$' || { echo "::error::model '$m' is not a model id"; exit 1; }
            models="$models $m"
          done
          echo "models=${models# }" >> "$GITHUB_OUTPUT"
          # The job has one time limit and the models run one after another in it. A combination that cannot fit is
          # refused here, before a token is spent: the runner would stop the job partway, with the tokens gone and
          # the running model's summary lost. 17 s per agent run is the rate measured at JOBS=4 (45 runs in 738 s);
          # 3 is the runs per case the cases declare.
          if [ -n "$SKILL" ]; then limit=30; set -- evals/"$SKILL"-*/; else limit=300; set -- evals/*/; fi
          cases=$#
          set -- ${models:-default}
          minutes=$(( cases * ${RUNS:-3} * $# * 17 / 60 ))
          if [ "$minutes" -gt "$limit" ]; then
            echo "::error::$cases case(s) x ${RUNS:-3} run(s) x $# model(s) is about $minutes min, the job stops at $limit: name fewer models, fewer runs or one skill"
            exit 1
          fi

      # Same pinned CLI as ci.yml — one pin, .github/versions.env, sourced rather than repeated; bubblewrap + socat
      # so the runner can sandbox the eval's tool calls on Linux. Ubuntu 24.04's AppArmor lets an unprivileged user
      # namespace exist but strips its capabilities, so bwrap fails at its first privileged step (bringing up the
      # loopback in a new network namespace: "loopback: Failed RTM_NEWADDR") and every Bash call in a case dies.
      - if: steps.token.outputs.enabled == 'true'
        name: Install the Claude Code CLI
        working-directory: .claude
        run: |
          . .github/versions.env
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat >/dev/null
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" >/dev/null && claude --version

      - if: steps.token.outputs.enabled == 'true'
        name: Static check first (no tokens)
        working-directory: .claude
        run: make -C context-db eval-check

      - if: steps.token.outputs.enabled == 'true'
        name: Run the suite
        working-directory: .claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SKILL: ${{ inputs.skill }}
          MODELS: ${{ steps.inputs.outputs.models }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          RUNS: ${{ inputs.runs }}
        shell: bash
        run: |
          set -o pipefail
          # `claude plugin eval` already keeps the credential out of a case: it hands the agent its token through
          # a file descriptor, builds the agent's environment from an allow-list, and runs each tool call in its
          # own bubblewrap sandbox. Do not set CLAUDE_CODE_SUBPROCESS_ENV_SCRUB on top: it nests a second bwrap that
          # cannot create its mask for the run's `.eval-artifacts` in the read-only working directory, so every
          # case's Bash fails. The probe starts bwrap once first: an installed bwrap that cannot start fails every
          # case's Bash, and the suite would spend the credential measuring that.
          command -v bwrap >/dev/null 2>&1 || { echo "::error::bwrap is missing — the eval's tool-call sandbox needs it"; exit 1; }
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true || { echo "::error::bwrap is installed but cannot start a sandbox — every case's Bash would fail, so nothing is spent"; exit 1; }
          rc=0
          for model in ${MODELS:-default}; do
            [ "$model" = default ] && model=""
            echo "## evals — ${SKILL:-every case} on ${model:-the make default (sonnet)}, judge ${JUDGE_MODEL:-the make default}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # an empty MODEL/JUDGE switches the make target's own default off, on the command line and from the
            # environment alike (make reads both): the inputs live in MODELS/JUDGE_MODEL, names make does not
            # use, and MODEL/JUDGE are passed only when the input actually names a model
            make -C context-db eval TRUST=1 JOBS=4 SKILL="$SKILL" RUNS="$RUNS" JSON_DIR="evals/results/$GITHUB_RUN_ID/${model:-default}" ${model:+"MODEL=$model"} ${JUDGE_MODEL:+"JUDGE=$JUDGE_MODEL"} \
              2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit $rc

      # The result JSON (--json, wired through the make target's JSON_DIR) survives the job even when a case
      # fails the run, so a red run's actual scores and criteria votes are still readable afterward — not just
      # the step summary's text. evals/results/ is git-ignored; this is the only place the JSON leaves the runner.
      - if: always() && steps.token.outputs.enabled == 'true'
        name: Upload the result JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-results-${{ github.run_id }}
          path: .claude/evals/results/${{ github.run_id }}/
          if-no-files-found: ignore
          retention-days: 30

      # A run with the secret missing skips every step above and would otherwise conclude success — a required
      # check satisfied by a run that evaluated nothing. workflow_dispatch always runs from within this repo (no
      # fork PR can trigger it), so the missing-secret case is always the same-repo one: a revoked token or a
      # renamed secret, never a fork with no access to it.
      - name: Fail when the credential was missing (nothing was evaluated)
        if: always() && steps.token.outputs.enabled != 'true'
        run: |
          echo "::error::evals skipped — CLAUDE_CODE_OAUTH_TOKEN not available; this run evaluated nothing"
          exit 1
