name: ci

# The kit has no build — "CI" is the checks a kit change must pass before any machine pulls it:
# the env-free validator passes on the bare checkout, every skill/agent carries its versioning frontmatter
# against a blank env store (kit_verify.py), the engine's unittest suite
# passes (context-db/tests/), every Python file
# compiles, every shell script parses. The kit runtime is stdlib only; the two jobs that run the unittest
# suite install one pinned test-only dependency (PyYAML, for the frontmatter cross-check — .github/versions.env).
# `make -C .claude/context-db ci` reproduces it locally.
#
# Runs on GitHub-hosted runners like every workflow (docs/contributing.md § Where CI runs): a job triggered by a pull
# request executes the PR's code, and a fork's PR may come from anyone. A fork's PR runs here without secrets, which
# is all these checks need.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-verify:
    name: kit-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The kit lives at <workspace>/.claude and finds the env store at <workspace>/.context, so
      # check it out one level down and give it a blank store — the same shape setup.sh builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .claude
          fetch-depth: 0  # the review gate diffs against the base branch

      # A Dependabot npm PR only ever touches a unit's package.json/package-lock.json — it cannot also bump
      # SKILL.md's metadata.version to satisfy the check below, so its manifest-only diff gets the same
      # --skip-bump treatment as the wording-only path (the third way docs/REVIEW.md § 1 lists), computed here
      # from the actor and the changed paths rather than as a silent exemption inside review_gate.py itself —
      # the reason stays visible in this run's log, not implicit in the diff's shape.
      - name: Dependabot manifest-only diff (bump exemption)
        if: github.event_name == 'pull_request'
        id: dependabot-manifest
        working-directory: .claude
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}  # the PR author, not github.actor (whoever triggered this run, e.g. a re-run)
        run: |
          git fetch -q --no-tags origin "$BASE_REF"
          skip=false
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
            if [ -n "$files" ] && [ -z "$(printf '%s\n' "$files" | grep -vE '^skills/[^/]+/package(-lock)?\.json$')" ]; then
              skip=true
              echo "bump check skipped: Dependabot manifest-only change"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Tier 0 of the review (docs/REVIEW.md § 1): what a diff against the base decides without a model — leak
      # shapes on every added line, a version + `updated` bump for every changed skill/agent. The
      # bump check is skipped for a PR the author marks wording-only (`wording` label, or `[skip-bump]` in the title or
      # body), or for a Dependabot npm PR the step above found manifest-only — both claims stay visible on the run
      # for the reviewer to question.
      # The gate, its leak shapes and the allow-list come from the BASE branch (#129): the PR's head is the thing being
      # judged, so its copy of review_gate.py / leak_shapes.py / allow.txt must not decide. The base copy runs against
      # this checkout (`--repo .`); a PR that changes the gate is tested by `make test` on its own head.
      - name: Review gate (tier 0 — leak shapes, bumps)
        if: github.event_name == 'pull_request'
        working-directory: .claude
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SKIP_BUMP: ${{ steps.dependabot-manifest.outputs.skip == 'true' || contains(github.event.pull_request.labels.*.name, 'wording') || contains(github.event.pull_request.title, '[skip-bump]') || contains(github.event.pull_request.body, '[skip-bump]') }}
        run: |
          git fetch -q --no-tags origin "$BASE_REF"
          git worktree add -q --detach "$RUNNER_TEMP/base-kit" "origin/$BASE_REF"
          set -- --repo . --base "origin/$BASE_REF" --head HEAD
          [ "$SKIP_BUMP" = "true" ] && set -- "$@" --skip-bump
          python3 "$RUNNER_TEMP/base-kit/context-db/bin/review_gate.py" "$@"

      # The same leak shapes over EVERY tracked file, not the diff (#95): a release commit pushed to main, a squash of
      # many PRs or a repo's first push is never a diff the step above sees. On PRs and on every push to main.
      - name: Review gate --tree (leak shapes over the whole tree)
        working-directory: .claude
        run: python3 context-db/bin/review_gate.py --tree

      # The environment-free validator: the check a contributor runs on a bare clone
      # (`make -C .claude/context-db verify-skill`) — frontmatter schema, body, leak shapes. `--no-env` reads no
      # store, so a previous run's .context left on a persistent runner changes nothing here.
      - name: Env-free validator (kit-verify --no-env)
        run: make -C .claude/context-db verify-skill

      - name: Blank env store (environment "ci")
        run: |
          rm -rf .context
          python3 .claude/context-db/bin/kb.py init --blank
          python3 .claude/context-db/bin/kb.py config-set environment ci

      - name: Skills and agents carry versioning frontmatter
        run: make -C .claude/context-db kit-verify

      # kit-health's leak scan against the blank store: the shapes plus whatever a store carries — here
      # nothing — over every kit file; CI mode writes nothing under .context/ and fails on an error or a leak hit.
      - name: kit-health --ci (leak scan, no writes)
        run: python3 .claude/skills/kit-health/kit-health.py --ci --quiet

      # A real YAML parser to cross-check every unit's frontmatter against (context-db/tests/test_frontmatter_yaml.py) —
      # not a kit runtime dependency (frontmatter.py stays stdlib-only), only this test job installs it. Pinned in
      # .github/versions.env; the test hard-fails (not skips) when CI=true and this import is missing.
      - name: Install PyYAML (frontmatter cross-check)
        run: |
          . .claude/.github/versions.env
          python3 -m pip install --quiet "PyYAML==$PYYAML_VERSION"

      - name: Engine tests
        run: make -C .claude/context-db test

      # Test isolation (#95, after #91): the suite must never read the workspace it sits in. Seed the sibling
      # .context/ with decoy values, run the suite on a throw-away store (ISOLATED=1) and fail if a decoy reaches
      # the output. The store is set back to the blank "ci" one afterwards.
      - name: Test isolation (decoy workspace)
        shell: bash
        run: |
          kb="python3 .claude/context-db/bin/kb.py"
          $kb config-set environment decoy-env-7q3x
          $kb set github.login decoy decoy-login-7q3x --from user
          $kb config-set leaks.markers '["decoy-marker-7q3x"]'
          rc=0; make -C .claude/context-db test ISOLATED=1 > "$RUNNER_TEMP/isolation.log" 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { tail -50 "$RUNNER_TEMP/isolation.log"; echo "::error::the suite failed on a throw-away store"; exit 1; }
          if grep -n 7q3x "$RUNNER_TEMP/isolation.log"; then
            echo "::error::a test read the sibling workspace's .context/ (#91) — resolve it lazily from CONTEXT_ROOT"; exit 1
          fi
          rm -rf .context && $kb init --blank && $kb config-set environment ci

      # The eval suite's static gate (#54): every case loads, every skill's trigger suite has >= 10 cases with positives
      # and near misses. No model and no tokens — the token-spending run is the manual `evals` workflow.
      - name: Eval suite (static, no tokens)
        run: make -C .claude/context-db eval-check

      # The plugin manifests through Claude Code's own validator. A hosted runner has no `claude` CLI, and the
      # Makefile target skips silently without one — so install it first (no account needed to validate); a failed
      # install fails the step rather than dropping the check. Version pinned once, in .github/versions.env — every
      # job that installs the CLI sources the same file.
      - name: Install the Claude Code CLI
        run: |
          . .claude/.github/versions.env
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" >/dev/null && claude --version
      - name: Plugin manifests validate
        run: make -C .claude/context-db plugin-validate

      - name: Python compiles
        working-directory: .claude
        run: git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile

      - name: Shell scripts parse
        working-directory: .claude
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; }
          done < <(git ls-files -z '*.sh' hooks/ ':!hooks/*.json')  # hooks.json is the plugin's hook manifest, not a script
          exit $rc

      # setup.sh / sync.sh run under `sh` (dash on most hosts) at every session end: a bashism passes `bash -n` and
      # breaks every machine, so every `#!/bin/sh` script is parsed by dash too.
      - name: POSIX scripts parse under dash
        working-directory: .claude
        run: make -C context-db parse  # the same selection `make ci` uses (every `#!/bin/sh` script + hook)

      # shellcheck -S warning: the system binary where the runner has one, else the PyPI wheel through uvx
      # (the runner has uv for pr-title/release); fixtures are test data.
      - name: shellcheck
        working-directory: .claude
        run: |
          files="$(git ls-files '*.sh' | grep -v /fixtures/) hooks/pre-push hooks/commit-msg"
          if command -v shellcheck >/dev/null 2>&1; then shellcheck -S warning $files
          elif command -v uvx >/dev/null 2>&1; then uvx --from shellcheck-py shellcheck -S warning $files
          else echo "::error::neither shellcheck nor uvx on this runner"; exit 1; fi

      # every relative Markdown link in the kit resolves
      - name: Markdown links resolve
        working-directory: .claude
        run: python3 context-db/bin/check_links.py

  # Whether this run needs the two legs below (macos, forced-signing): both exercise BSD/macOS fallbacks and
  # signing-hostile git config that only skills/_lib/portable.sh, the shell fixtures and their tests touch — a
  # macOS runner is the priciest minute on the matrix, so it (and its Linux sibling, kept next to it so the two
  # stay in the same on-condition) starts only when the diff could plausibly move them. A push to main (not a
  # pull_request) always runs both: main is never skipped just because no single PR's diff looked relevant.
  changed-paths:
    name: changed-paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      portability: ${{ steps.check.outputs.portability }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Always runs (never gated by its own `if:`), so the two jobs below can simply key off its output instead
      # of also reasoning about GitHub's "needs a skipped job" propagation. A push to main always sets
      # portability=true (main gets the full matrix on every merge — this only bounds cost across a PR's own
      # iterating pushes); a pull_request diffs base..head, falling back to "run it" when the base is unusable
      # (force-push over history this shallow-enough checkout doesn't have).
      - id: check
        name: Does this PR touch a shell script, its tests, or skills/_lib?
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "portability=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_BASE" ] || ! git cat-file -e "$PR_BASE" 2>/dev/null; then
            echo "portability=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$PR_BASE" "$PR_HEAD")"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq '\.sh$|^context-db/tests/|^skills/_lib/|^hooks/|^\.github/workflows/ci\.yml$'; then
            echo "portability=true" >> "$GITHUB_OUTPUT"
          else
            echo "portability=false" >> "$GITHUB_OUTPUT"
          fi

  # The BSD/macOS fallbacks in skills/_lib/portable.sh (no flock, no setsid, BSD date) are exercised by
  # PATH-manipulation tests on a Linux runner only — this is the real interpreter those fallbacks are for.
  # Gated by changed-paths above so an unrelated PR never pays for a macOS minute.
  macos:
    name: macos (portable.sh, bash/sh/dash parse)
    needs: changed-paths
    if: needs.changed-paths.outputs.portability == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # macOS's system python3 is externally managed (PEP 668) — `pip install` straight into it errors
      # unless you pass --break-system-packages, which this kit doesn't do anywhere else. A venv sidesteps
      # that without a second pinned Python (no PYTHON_VERSION in versions.env — every other job just uses
      # the runner's preinstalled python3 too); its bin/ goes on PATH so `make … test` below picks it up.
      - name: Install PyYAML (frontmatter cross-check)
        run: |
          . .github/versions.env
          python3 -m venv "$RUNNER_TEMP/pyyaml-venv"
          "$RUNNER_TEMP/pyyaml-venv/bin/pip" install --quiet "PyYAML==$PYYAML_VERSION"
          echo "$RUNNER_TEMP/pyyaml-venv/bin" >> "$GITHUB_PATH"
      - name: Engine tests on macOS
        run: make -C context-db test
      # Picked by shebang, like the Linux "Shell scripts parse" + "POSIX scripts parse under dash" steps
      # together: a `#!/usr/bin/env bash` / `#!/bin/bash` script uses bash syntax (`< <(...)`, arrays) that
      # `sh -n`/`dash -n` reject outright — it gets `bash -n` under the macOS SYSTEM bash (3.2, GPLv2-frozen;
      # never Homebrew's), the real interpreter the portability work must keep parsing under. A `#!/bin/sh`
      # script or one with no shebang (skills/_lib/portable.sh, sourced — see its own header) is the POSIX
      # surface these legs exist to prove, so it gets `sh -n` and, where installed, `dash -n` too.
      - name: Bash-shebang scripts parse under the macOS system bash (3.2)
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            case "$(head -1 "$f")" in
              '#!'*bash*) bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; } ;;
            esac
          done < <(git ls-files -z '*.sh' hooks/ ':!hooks/*.json')
          exit $rc
      - name: sh/no-shebang scripts parse under sh (and dash, where installed)
        run: |
          rc=0
          command -v dash >/dev/null 2>&1 || brew install dash >/dev/null 2>&1 || true
          while IFS= read -r -d '' f; do
            case "$(head -1 "$f")" in
              '#!'*bash*) continue ;;
            esac
            sh -n "$f" || { echo "::error file=$f::sh -n failed"; rc=1; }
            if command -v dash >/dev/null 2>&1; then
              dash -n "$f" || { echo "::error file=$f::dash -n failed"; rc=1; }
            fi
          done < <(git ls-files -z '*.sh' hooks/ ':!hooks/*.json')
          exit $rc

  # The hermetic-fixture work (test_hermetic_fixtures.py) checks the tests against a hostile ~/.gitconfig built
  # inside one test, never across a whole suite run whose runner itself has commit.gpgsign=true — a config a
  # contributor with SSH-signed commits on by default really has. Force it on the runner before the suite (a
  # signing key that cannot exist, so any unhermetic `git commit` fails loudly) and require the suite to stay
  # green; same path gate as macos above.
  forced-signing:
    name: forced-signing (hostile ambient git config)
    needs: changed-paths
    if: needs.changed-paths.outputs.portability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Force commit signing through a key that does not exist
        run: |
          git config --global commit.gpgsign true
          git config --global gpg.format ssh
          git config --global user.signingkey "$RUNNER_TEMP/no-such-signing-key"
      - name: Install PyYAML (frontmatter cross-check)
        run: |
          . .github/versions.env
          python3 -m pip install --quiet "PyYAML==$PYYAML_VERSION"
      - name: Engine tests under forced signing
        run: make -C context-db test

  # The floor the kit declares (kit_profile.py's own guard; docs/contributing.md § Testing): the engine's stdlib
  # code uses zoneinfo, Path.is_relative_to and str.removeprefix, all 3.9+-only, so 3.9 is the oldest interpreter
  # that must still pass. ubuntu-latest only — a Python-version floor is orthogonal to the macos leg above
  # (BSD/macOS shell behaviour, not the interpreter version), so it stays its own always-on job.
  python-floor:
    name: python-floor (3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Env-free validator (kit-verify --no-env) on the floor
        run: make -C context-db verify-skill
      - name: Install PyYAML (frontmatter cross-check)
        run: |
          . .github/versions.env
          python3 -m pip install --quiet "PyYAML==$PYYAML_VERSION"
      - name: Engine tests on the floor
        run: make -C context-db test

  # The README's own install blocks, replayed on a runner that has never seen the kit (#98): the clone path and the
  # plugin path (a real `claude plugin marketplace add` + `install` from this checkout), each ending in kit-health. The
  # block is read from README.md, so a README change is tested as written; the few swaps (this checkout for the
  # published source, the in-session `/kit-setup` / `/kit-health`) are printed in the log.
  install-smoke:
    name: install-smoke (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path: [clone, plugin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Claude Code CLI (plugin path)
        if: matrix.path == 'plugin'
        run: |
          . .github/versions.env
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" >/dev/null && claude --version
      - name: Replay the README install block
        run: python3 context-db/tests/install_smoke.py ${{ matrix.path }} --require-cli
