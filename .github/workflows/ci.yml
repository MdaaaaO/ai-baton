name: ci

# The kit has no build — "CI" is the checks a kit change must pass before any machine pulls it:
# the env-free validator passes on the bare checkout, every skill/agent carries its versioning frontmatter
# against a blank env store (kit_verify.py), the engine's unittest suite
# passes (context-db/tests/), every Python file
# compiles, every shell script parses. Stdlib only, so nothing is installed. `make -C .claude/context-db ci`
# reproduces it locally.
#
# Runs on GitHub-hosted runners like every workflow (docs/contributing.md § Where CI runs): a job triggered by a pull
# request executes the PR's code, and a fork's PR may come from anyone. A fork's PR runs here without secrets, which
# is all these checks need.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One pin for every job that installs the Claude Code CLI (kit-verify's manifest check, install-smoke's plugin leg);
# bump on purpose.
env:
  CLAUDE_CODE_VERSION: 2.1.283

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit-verify:
    name: kit-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The kit lives at <workspace>/.claude and finds the env store at <workspace>/.context, so
      # check it out one level down and give it a blank store — the same shape setup.sh builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .claude
          fetch-depth: 0  # the review gate diffs against the base branch

      # Tier 0 of the review (docs/REVIEW.md § 1): what a diff against the base decides without a model — leak
      # shapes on every added line, a version + `updated` bump for every changed skill/agent. The
      # bump check is skipped for a PR the author marks wording-only (`wording` label, or `[skip-bump]` in the title or
      # body) — the claim stays visible on the PR for the reviewer to question.
      # The gate, its leak shapes and the allow-list come from the BASE branch (#129): the PR's head is the thing being
      # judged, so its copy of review_gate.py / leak_shapes.py / allow.txt must not decide. The base copy runs against
      # this checkout (`--repo .`); a PR that changes the gate is tested by `make test` on its own head.
      - name: Review gate (tier 0 — leak shapes, bumps)
        if: github.event_name == 'pull_request'
        working-directory: .claude
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          SKIP_BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'wording') || contains(github.event.pull_request.title, '[skip-bump]') || contains(github.event.pull_request.body, '[skip-bump]') }}
        run: |
          git fetch -q --no-tags origin "$BASE_REF"
          git worktree add -q --detach "$RUNNER_TEMP/base-kit" "origin/$BASE_REF"
          set -- --repo . --base "origin/$BASE_REF" --head HEAD
          [ "$SKIP_BUMP" = "true" ] && set -- "$@" --skip-bump
          python3 "$RUNNER_TEMP/base-kit/context-db/bin/review_gate.py" "$@"

      # The same leak shapes over EVERY tracked file, not the diff (#95): a release commit pushed to main, a squash of
      # many PRs or a repo's first push is never a diff the step above sees. On PRs and on every push to main.
      - name: Review gate --tree (leak shapes over the whole tree)
        working-directory: .claude
        run: python3 context-db/bin/review_gate.py --tree

      # The environment-free validator: the check a contributor runs on a bare clone
      # (`make -C .claude/context-db verify-skill`) — frontmatter schema, body, leak shapes. `--no-env` reads no
      # store, so a previous run's .context left on a persistent runner changes nothing here.
      - name: Env-free validator (kit-verify --no-env)
        run: make -C .claude/context-db verify-skill

      - name: Blank env store (environment "ci")
        run: |
          rm -rf .context
          python3 .claude/context-db/bin/kb.py init --blank
          python3 .claude/context-db/bin/kb.py config-set environment ci

      - name: Skills and agents carry versioning frontmatter
        run: make -C .claude/context-db kit-verify

      # kit-health's leak scan against the blank store: the shapes plus whatever a store carries — here
      # nothing — over every kit file; CI mode writes nothing under .context/ and fails on an error or a leak hit.
      - name: kit-health --ci (leak scan, no writes)
        run: python3 .claude/skills/kit-health/kit-health.py --ci --quiet

      - name: Engine tests
        run: make -C .claude/context-db test

      # Test isolation (#95, after #91): the suite must never read the workspace it sits in. Seed the sibling
      # .context/ with decoy values, run the suite on a throw-away store (ISOLATED=1) and fail if a decoy reaches
      # the output. The store is set back to the blank "ci" one afterwards.
      - name: Test isolation (decoy workspace)
        shell: bash
        run: |
          kb="python3 .claude/context-db/bin/kb.py"
          $kb config-set environment decoy-env-7q3x
          $kb set github.login decoy decoy-login-7q3x --from user
          $kb config-set leaks.markers '["decoy-marker-7q3x"]'
          rc=0; make -C .claude/context-db test ISOLATED=1 > "$RUNNER_TEMP/isolation.log" 2>&1 || rc=$?
          [ "$rc" -eq 0 ] || { tail -50 "$RUNNER_TEMP/isolation.log"; echo "::error::the suite failed on a throw-away store"; exit 1; }
          if grep -n 7q3x "$RUNNER_TEMP/isolation.log"; then
            echo "::error::a test read the sibling workspace's .context/ (#91) — resolve it lazily from CONTEXT_ROOT"; exit 1
          fi
          rm -rf .context && $kb init --blank && $kb config-set environment ci

      # The eval suite's static gate (#54): every case loads, every skill's trigger suite has >= 10 cases with positives
      # and near misses. No model and no tokens — the token-spending run is the manual `evals` workflow.
      - name: Eval suite (static, no tokens)
        run: make -C .claude/context-db eval-check

      # The plugin manifests through Claude Code's own validator. A hosted runner has no `claude` CLI, and the
      # Makefile target skips silently without one — so install it first (no account needed to validate); a failed
      # install fails the step rather than dropping the check. Pinned like every other CI dependency; bump on purpose.
      - name: Install the Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" >/dev/null && claude --version
      - name: Plugin manifests validate
        run: make -C .claude/context-db plugin-validate

      - name: Python compiles
        working-directory: .claude
        run: git ls-files -z '*.py' | xargs -0 -r python3 -m py_compile

      - name: Shell scripts parse
        working-directory: .claude
        run: |
          rc=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; rc=1; }
          done < <(git ls-files -z '*.sh' hooks/ ':!hooks/*.json')  # hooks.json is the plugin's hook manifest, not a script
          exit $rc

      # setup.sh / sync.sh run under `sh` (dash on most hosts) at every session end: a bashism passes `bash -n` and
      # breaks every machine, so every `#!/bin/sh` script is parsed by dash too.
      - name: POSIX scripts parse under dash
        working-directory: .claude
        run: make -C context-db parse  # the same selection `make ci` uses (every `#!/bin/sh` script + hook)

      # shellcheck -S warning: the system binary where the runner has one, else the PyPI wheel through uvx
      # (the runner has uv for pr-title/release); fixtures are test data.
      - name: shellcheck
        working-directory: .claude
        run: |
          files="$(git ls-files '*.sh' | grep -v /fixtures/) hooks/pre-push hooks/commit-msg"
          if command -v shellcheck >/dev/null 2>&1; then shellcheck -S warning $files
          elif command -v uvx >/dev/null 2>&1; then uvx --from shellcheck-py shellcheck -S warning $files
          else echo "::error::neither shellcheck nor uvx on this runner"; exit 1; fi

      # every relative Markdown link in the kit resolves
      - name: Markdown links resolve
        working-directory: .claude
        run: python3 context-db/bin/check_links.py

  # The README's own install blocks, replayed on a runner that has never seen the kit (#98): the clone path and the
  # plugin path (a real `claude plugin marketplace add` + `install` from this checkout), each ending in kit-health. The
  # block is read from README.md, so a README change is tested as written; the few swaps (this checkout for the
  # published source, the in-session `/kit-setup` / `/kit-health`) are printed in the log.
  install-smoke:
    name: install-smoke (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path: [clone, plugin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Claude Code CLI (plugin path)
        if: matrix.path == 'plugin'
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" >/dev/null && claude --version
      - name: Replay the README install block
        run: python3 context-db/tests/install_smoke.py ${{ matrix.path }} --require-cli
