name: release

# The CI half of a kit release (docs/contributing.md § Releases). On a push to main whose commit is a
# squash-merged `chore(release): X.Y.Z`: check VERSION agrees, tag that commit vX.Y.Z and publish a GitHub
# Release whose notes are the version's CHANGELOG.md section. Any other commit: the job is skipped.
# Self-healing (#43): each step does only what is missing, so re-running a failed run finishes a half-done
# release — tag pushed but no Release: the Release is created from the existing tag; both there: a no-op.
# Inline rather than conventional-release's reusable tag.yml. Runs on GitHub-hosted runners like every workflow; only on a
# push to main, i.e. code that was already merged — never a pull request's (docs/contributing.md § Where CI runs).
# Nothing is published as a package — the kit is no library.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    # Only a release commit gets the checkout, uv and detect; detect still decides (subject + VERSION).
    # A re-run keeps the original push payload, so this holds for re-runs too.
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # push the tag, create the release
    env:
      TOOL: conventional-release>=0.3.1,<1  # 0.3.1: publish-release; detect names a tag already on HEAD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # detect needs the tags
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # released=true: a release commit without its tag. released=false with a tag: the tag already marks
      # this commit (a re-run). The tag on another commit, or VERSION disagreeing with the subject, fails here.
      - id: detect
        name: Is this a release commit?
        run: uvx --from "$TOOL" conventional-release detect --github-output

      - name: Tag the release commit
        if: steps.detect.outputs.released == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from "$TOOL" conventional-release tag "$VERSION" --push

      # Whenever the commit carries its tag, new or from an earlier attempt: creates the Release only when
      # `gh release view` says "release not found"; any other gh error fails the step.
      - name: GitHub Release
        if: steps.detect.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: uvx --from "$TOOL" conventional-release publish-release "$VERSION"
