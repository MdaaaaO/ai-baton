# Third-party actions are pinned by commit SHA; Dependabot proposes the bumps and keeps the `# vN` comment.
# Labels are the repo's own documented set (docs/contributing.md § Labels): type + area on every PR, so
# `enhancement` (a bump is a type: feat) — not `dependencies`, which the label list does not carry.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: [enhancement, area:ci]

  # skills/pr-open/mermaid-check.mjs's own three deps (mermaid, jsdom, dompurify) — installed into a
  # scratchpad with `npm ci`, never run in place; Dependabot still needs the manifest's directory to track them.
  - package-ecosystem: npm
    directory: /skills/pr-open
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    labels: [enhancement, area:skills]
